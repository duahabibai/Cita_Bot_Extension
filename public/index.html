<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Cita Bot | Service Active</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b; /* Zinc 950 */
            color: #fafafa;
        }
        .glow {
            box-shadow: 0 0 40px -10px rgba(16, 185, 129, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-[#18181b] border border-[#27272a] rounded-2xl p-8 shadow-2xl relative overflow-hidden text-center">
        <!-- Background subtle glow -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-24 bg-emerald-500/20 blur-[50px] -z-10"></div>
        
        <div class="mx-auto w-16 h-16 bg-emerald-500/10 rounded-full flex items-center justify-center mb-6 glow border border-emerald-500/20">
            <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </div>

        <h1 class="text-2xl font-bold mb-2 text-white tracking-tight">Auto-Cita Bot</h1>
        <p class="text-zinc-400 text-sm mb-8">The automation service is currently active and running securely in the cloud.</p>
        
        <div class="bg-[#09090b] rounded-lg p-4 border border-[#27272a] text-left">
            <div class="flex items-center justify-between mb-3">
                <span class="text-sm text-zinc-400 font-medium">System Status</span>
                <span class="flex items-center gap-1.5 text-xs font-semibold text-emerald-400 bg-emerald-400/10 px-2 py-1 rounded-full border border-emerald-400/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    Online
                </span>
            </div>
            <div class="space-y-2">
                <div class="flex justify-between text-xs">
                    <span class="text-zinc-500">Telegram Bot</span>
                    <span class="text-zinc-300 font-mono">Connected</span>
                </div>
                <div class="flex justify-between text-xs">
                    <span class="text-zinc-500">Playwright Engine</span>
                    <span class="text-zinc-300 font-mono">Ready</span>
                </div>
                <div class="flex justify-between text-xs">
                    <span class="text-zinc-500">Health Check</span>
                    <span class="text-emerald-400 font-mono">Passing</span>
                </div>
            </div>
        </div>

        <div class="mt-8 text-xs text-zinc-600">
            &copy; 2024 Auto-Cita Automation.<br>All systems nominal.
        </div>
    </div>
    
    <!-- Keep-Alive Script -->
    <script>
        // Ping the server every 15 seconds to prevent it from sleeping in serverless environments
        setInterval(() => {
            fetch('/api/health').catch(() => {});
        }, 15000);
    </script>
</body>
</html>
